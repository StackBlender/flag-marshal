name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Git history is analysis input: flag age and last-touched dates come
          # from `git log`. A shallow clone would silently weaken that evidence.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:npm-package
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low
